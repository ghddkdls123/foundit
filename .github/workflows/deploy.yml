# 저장소 위치: .github/workflows/deploy.yml (foundit 저장소)
# main 브랜치에 push되면 빌드 -> S3 업로드 -> CloudFront 캐시 비우기를 자동으로 한다.
# 배포 전용 IAM 사용자(refind-frontend-deploy)의 키를 GitHub Secrets에서 꺼내 쓴다.
# 필요한 Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

name: Deploy frontend to S3 and CloudFront

on:
  push:
    branches: [master, main] # foundit 저장소 기본 브랜치는 master
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read

concurrency:
  group: deploy-frontend # 배포가 겹치지 않게 한 번에 하나만
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  BUCKET: refind-frontend-528730
  DISTRIBUTION_ID: E1L3OD7MPRYLO9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 24 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - name: 빌드 결과 확인
        run: |
          test -f dist/index.html || { echo "dist/index.html이 없어요. 빌드 결과 폴더를 확인하세요."; exit 1; }

      - name: AWS 배포 키 설정 (GitHub Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3에 올리기
        run: |
          # 1) assets 폴더: 파일 이름에 해시가 붙어 있어서 내용이 바뀌면 이름도 바뀜 -> 1년 캐시
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # 2) 나머지(index.html, 아이콘 등): 항상 최신을 확인하게 no-cache
          aws s3 sync dist "s3://$BUCKET" \
            --exclude "assets/*" \
            --cache-control "no-cache"
          # 3) 새 빌드에 없는 예전 파일 정리
          aws s3 sync dist "s3://$BUCKET" --delete

      - name: CloudFront 캐시 비우기
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" --output text
